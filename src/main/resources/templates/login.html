<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Login - Gestión de Contenedores</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="bg-light d-flex align-items-center" style="min-height: 100vh;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <!-- Logo y título -->
                <div class="text-center mb-4">
                    <i class="fas fa-recycle fa-4x text-success mb-3"></i>
                    <h2>Sistema de Gestión de Contenedores</h2>
                    <p class="text-muted">Debe iniciar sesión para continuar</p>
                </div>
                
                <div class="card shadow">
                    <div class="card-body p-4">
                        <h4 class="text-center mb-4">
                            <i class="fas fa-sign-in-alt me-2"></i>Iniciar Sesión
                        </h4>
                        
                        <!-- Formulario de Login -->
                        <form th:action="@{/login}" method="post">
                            <div class="mb-3">
                                <label for="username" class="form-label">
                                    <i class="fas fa-user me-1"></i>Usuario
                                </label>
                                <input type="text" id="username" name="username" 
                                       class="form-control form-control-lg" 
                                       placeholder="Ingrese e-email" required autofocus />
                            </div>
                            
                            <div class="mb-4">
                                <label for="password" class="form-label">
                                    <i class="fas fa-lock me-1"></i>Contraseña
                                </label>
                                <input type="password" id="password" name="password" 
                                       class="form-control form-control-lg" 
                                       placeholder="Ingrese su contraseña" required />
                            </div>
                            
                            <button type="submit" class="btn btn-success btn-lg w-100">
                                <i class="fas fa-sign-in-alt me-2"></i>Entrar al Sistema
                            </button>
                        </form>
                        
                        <!-- Mensajes de error -->
                        <div th:if="${errorMessage}" class="alert alert-danger mt-3 mb-0" role="alert">
                            <i class="fas fa-exclamation-circle me-2"></i>
                            <span th:text="${errorMessage}"></span>
                        </div>


                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="position-fixed bottom-0 w-100 text-center py-3 bg-white border-top">
        <p class="mb-0 text-muted small">
            <i class="fas fa-graduation-cap text-primary me-1"></i>
            Diseño de Software - Universidad de Deusto
        </p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
